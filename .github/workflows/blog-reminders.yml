# Daily: reminds Vinod about a blog draft still waiting for approval after 3 days,
# and removes drafts (unpublished) after 7 days. The work happens on the site — see
# src/app/api/blog/reminders/route.ts and runReminders() in src/lib/blog-autopost.ts.
#
# Repository secret: BLOG_REVIEW_SECRET (same value as in Vercel)

name: Blog approval reminders

on:
  schedule:
    - cron: "0 5 * * *" # every day, 10:30 India time
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remind about waiting drafts, remove expired ones
        env:
          BLOG_REVIEW_SECRET: ${{ secrets.BLOG_REVIEW_SECRET }}
        run: |
          curl --fail-with-body -sS -X POST "https://vinodkeshariya.vercel.app/api/blog/reminders" \
            -H "Authorization: Bearer $BLOG_REVIEW_SECRET"
