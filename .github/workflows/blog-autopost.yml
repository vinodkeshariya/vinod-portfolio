# Weekly blog auto-post.
#   1. Gemini writes the next topic from content/blog/_topics.md using the site's own content (read from the CMS)
#   2. Checks: content rules + AI fact-check (one automatic fix)
#   3. Approval mode (default): the site saves the post in the CMS as a draft and emails Vinod a
#      "Preview & publish" link — it only goes live when he presses Publish (or publishes it in /admin).
#      AUTO_PUBLISH=true: posts that pass every check are published straight away instead.
#   4. The topic is ticked off in _topics.md so next week moves on.
# Run it by hand from the Actions tab ("Run workflow").
#
# Repository secrets: GEMINI_API_KEY, BLOG_REVIEW_SECRET (same value as in Vercel)
# (BLOG_GITHUB_TOKEN, optional: a token that may push to main if the default one can't)

name: Blog auto-post

on:
  schedule:
    - cron: "30 4 * * 1" # every Monday, 10:00 India time
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional: write about this instead of the next queued topic — "pillar | Title | angle"'
        required: false
        default: ""

env:
  AUTO_PUBLISH: "false" # "true" = publish posts that pass every check without asking
  SITE_URL: https://vinodkeshariya.vercel.app

permissions:
  contents: write

concurrency:
  group: blog-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BLOG_GITHUB_TOKEN || github.token }}

      # the script only uses Node's own modules (and Node's built-in TypeScript support) — no npm install needed
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Write the post and send it for approval
        id: post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_REVIEW_SECRET: ${{ secrets.BLOG_REVIEW_SECRET }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: node scripts/blog/autopost.mjs

      - name: Tick the topic off the queue
        if: steps.post.outputs.status == 'approval' || steps.post.outputs.status == 'published'
        env:
          TITLE: ${{ steps.post.outputs.title }}
          STATUS: ${{ steps.post.outputs.status }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog/_topics.md
          git commit -m "Blog topic queue: \"$TITLE\" ($STATUS)" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
